<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FleetBuddy — Walkaround Angle Icons</title>
<style>
  :root{
    --bg:#F2F3F5;
    --card:#FFFFFF;
    --border:#E2E4E8;
    --muted:#9AA0A6;
    --dark:#374151;
    --accent:#111827;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 20px 60px;
    background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--dark);
  }
  h1{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 4px;}
  p.sub{margin:0 0 28px;color:var(--muted);font-size:14px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
    max-width:560px;
  }
  .card{
    background:var(--card);
    border:1.5px dashed var(--border);
    border-radius:18px;
    padding:28px 12px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .card svg{width:64px;height:64px;}
  .card span{font-weight:600;font-size:15px;color:var(--dark);}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:40px 0 12px;}
  pre{
    background:#0B1220;
    color:#D1D5DB;
    padding:16px;
    border-radius:10px;
    overflow-x:auto;
    font-size:12px;
    line-height:1.5;
  }
  .tag{color:#F59E0B;}
  .attr{color:#93C5FD;}
  .val{color:#86EFAC;}
</style>
</head>
<body>

<h1>Photo Walkaround</h1>
<p class="sub">8 of 8 angle icons — grayscale, matches existing camera-icon style</p>

<div class="grid" id="grid"></div>

<h2>Copy-paste SVG source (for FleetBuddy)</h2>
<pre id="code"></pre>

<script>
// Car top-down base + highlighted zone per angle.
// Body: rounded rect. Wheels: 4 dark notches. Highlight: bold stroke arc/segment
// on the relevant edge/corner + a small solid dot (camera POV) outside it.

const BODY = `
  <rect x="20" y="10" width="24" height="44" rx="8" fill="none" stroke="#D1D5DB" stroke-width="2.5"/>
  <rect x="14" y="16" width="6" height="9" rx="2" fill="#D1D5DB"/>
  <rect x="44" y="16" width="6" height="9" rx="2" fill="#D1D5DB"/>
  <rect x="14" y="39" width="6" height="9" rx="2" fill="#D1D5DB"/>
  <rect x="44" y="39" width="6" height="9" rx="2" fill="#D1D5DB"/>
  <line x1="24" y1="20" x2="40" y2="20" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="24" y1="46" x2="40" y2="46" stroke="#D1D5DB" stroke-width="2"/>
`;

// highlight path + dot position per angle key
const ANGLES = {
  front:    { seg: `<line x1="22" y1="11" x2="42" y2="11" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [32, 3] },
  rear:     { seg: `<line x1="22" y1="53" x2="42" y2="53" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [32, 61] },
  left:     { seg: `<line x1="21" y1="12" x2="21" y2="52" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [8, 32] },
  right:    { seg: `<line x1="43" y1="12" x2="43" y2="52" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [56, 32] },
  fl:       { seg: `<path d="M21 20 Q21 11 30 11" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [12, 9] },
  fr:       { seg: `<path d="M34 11 Q43 11 43 20" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [52, 9] },
  rl:       { seg: `<path d="M21 44 Q21 53 30 53" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [12, 55] },
  rr:       { seg: `<path d="M34 53 Q43 53 43 44" fill="none" stroke="#111827" stroke-width="3.5" stroke-linecap="round"/>`, dot: [52, 55] },
};

const LABELS = {
  front:"Front", rear:"Rear", left:"Left side", right:"Right side",
  fl:"Front-left corner", fr:"Front-right corner",
  rl:"Rear-left corner", rr:"Rear-right corner"
};

function iconSVG(key){
  const a = ANGLES[key];
  return `<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  ${BODY}
  ${a.seg}
  <circle cx="${a.dot[0]}" cy="${a.dot[1]}" r="3" fill="#111827"/>
</svg>`;
}

const grid = document.getElementById('grid');
const order = ['front','rear','left','right','fl','fr','rl','rr'];
let codeBlock = '';

order.forEach(key=>{
  const svg = iconSVG(key);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `${svg}<span>${LABELS[key]}</span>`;
  grid.appendChild(card);
  codeBlock += `<!-- ${LABELS[key]} -->\nconst icon_${key} = \`${svg.replace(/\n\s*/g,' ').trim()}\`;\n\n`;
});

document.getElementById('code').textContent = codeBlock;
</script>

</body>
</html>
